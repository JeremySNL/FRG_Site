# Runs the same gate as the Cloudflare build (`npm run verify`) on every push
# and pull request, so a broken branch shows a red check before it reaches
# `main`. The deploy itself stays in Cloudflare: its build command is
# `npm run verify`, so a failing check there stops the publication.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
